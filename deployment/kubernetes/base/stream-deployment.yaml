apiVersion: apps/v1
kind: Deployment
metadata:
  name: phots-stream
spec:
  # SQLite state is single-writer; do not scale replicas without externalizing it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: phots
      app.kubernetes.io/component: stream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phots
        app.kubernetes.io/component: stream
    spec:
      serviceAccountName: phots-scan
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner
          image: phots:local
          imagePullPolicy: IfNotPresent
          args:
            - stream
            - --out
            - /state
            - --workers
            - "2"
            - --max-workers
            - "2"
            - --poll-seconds
            - "30"
            - --no-tui
            - --supabase
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phots-supabase
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: phots-supabase
                  key: SUPABASE_SECRET_KEY
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: phots-stream-state
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
