[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phots"
version = "0.1.0"
description = "Local-first WordPress plugin source triage and audit workflow"
requires-python = ">=3.10"

[project.scripts]
phots = "scanner:main"

[tool.setuptools]
py-modules = ["scanner", "scope_filter", "ai_triage", "supabase_store", "wp_fetcher"]

[tool.setuptools.data-files]
"share/phots/rules" = ["rules/wordpress_multilang.yml"]
